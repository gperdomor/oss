packages:
  - 'packages/*'
  - 'apps/*'
  - 'docs/*'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  '@swc/core': false
  esbuild: false
  lefthook: true
  less: false
  nx: true
  prisma: false
  sharp: false
  unrs-resolver: false

overrides:
  '@nx/devkit': '23.0.0'
  'nx': '23.0.0'

catalog:
  tslib: '2.8.1'
  tsx: '4.23.1'
